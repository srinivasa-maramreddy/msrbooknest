services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: bookstore-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  mysql:
    image: mysql:8.0
    container_name: bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      APP_OTP_DEV_SHOW_CODES: "true"
      APP_EMAIL_OTP_ENABLED: "false"
      APP_HEALTH_MAIL_ENABLED: "false"
      APP_DEMO_SEED_USERS: "true"
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: catalog-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_SHOW_SQL: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      APP_WEB_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: cart-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cart_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_SHOW_SQL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8082
      APP_WEB_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_SHOW_SQL: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8082
      CART_SERVICE_BASE_URL: http://cart-service:8084
      APP_WEB_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_SHOW_SQL: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      APP_WEB_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  buyback-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: buyback-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/buyback_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_SHOW_SQL: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-msrbooknest-demo-signing-key-change-me}
      APP_WEB_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  customer-web:
    build:
      context: ./customer-web-react
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - buyback-service

volumes:
  kafka_data:
  mysql_data:

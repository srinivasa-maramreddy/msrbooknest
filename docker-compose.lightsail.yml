services:
  # The storefront is hosted by GitHub Pages, so keep its container local-only.
  customer-web:
    profiles: [local]

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
    mem_limit: 1536m
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=150
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 30

  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1024m

  auth-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      APP_DEMO_SEED_USERS: "false"
      APP_DEMO_SEED_READER: "true"
      APP_EMAIL_OTP_ENABLED: ${APP_EMAIL_OTP_ENABLED:-false}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
      APP_HEALTH_MAIL_ENABLED: "false"
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  catalog-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  cart-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  order-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  payment-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      RAZORPAY_ENABLED: "false"
      RAZORPAY_ALLOW_LIVE: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  buyback-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.lightsail}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.lightsail}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    mem_limit: 640m

  api-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./infra/lightsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - buyback-service
    mem_limit: 128m

  https-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to a DNS name pointing to the Lightsail static IP}
    volumes:
      - ./infra/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - api-gateway
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:

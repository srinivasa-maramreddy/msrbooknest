server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cart_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=${MYSQL_SSL_MODE:DISABLED}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:msrbooknest-demo-signing-key-change-me}
  web-origins: ${APP_WEB_ORIGINS:http://localhost:5173}
  services:
    catalog-base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}

spring:
  application:
    name: enterprise-bookstore
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8090

app:
  jwt:
    secret: ${APP_JWT_SECRET:TXlFbnRlcnByaXNlQm9va3N0b3JlSldUU2VjcmV0S2V5Rm9yRGV2U2V0dXA=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  security:
    admin-registration-key: ${APP_ADMIN_REGISTRATION_KEY:admin-secret-key}
  otp:
    length: ${APP_OTP_LENGTH:6}
    expiration-minutes: ${APP_OTP_EXPIRATION_MINUTES:10}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    email-enabled: ${APP_OTP_EMAIL_ENABLED:false}
    mail-from: ${APP_OTP_MAIL_FROM:noreply@bookstore.local}

logging:
  level:
    root: INFO
    com.bookstore.enterprise: INFO
    org.springframework.security: INFO

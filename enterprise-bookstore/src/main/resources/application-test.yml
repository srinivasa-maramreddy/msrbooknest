spring:
  datasource:
    url: jdbc:h2:mem:bookstore;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: VGVzdEJvb2tzdG9yZUpXVFNlY3JldEtleUZvckludGVncmF0aW9uVGVzdHM=
    expiration-ms: 86400000
  security:
    admin-registration-key: admin-secret-key-test
  otp:
    length: 6
    expiration-minutes: 10
    max-attempts: 5
    email-enabled: false
    mail-from: noreply@bookstore.local

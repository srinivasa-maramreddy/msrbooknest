name: Deploy msrbooknest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "customer-web-react/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the application
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.8.1

      - name: Install storefront dependencies
        working-directory: customer-web-react
        run: pnpm install --frozen-lockfile

      - name: Build the storefront
        working-directory: customer-web-react
        env:
          VITE_BASE_PATH: /msrbooknest/
          VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
          VITE_DEMO_MODE: ${{ vars.VITE_BACKEND_BASE_URL == '' && 'true' || 'false' }}
          VITE_MOCK_NPCI: "true"
        run: pnpm build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: customer-web-react/dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

server {
    listen 8080;
    server_name _;
    client_max_body_size 4m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = / {
        default_type application/json;
        return 200 '{"service":"msrbooknest-api-gateway","status":"ok"}';
    }

    location ^~ /api/auth {
        proxy_pass http://auth-service:8081;
    }

    location ^~ /api/products {
        proxy_pass http://catalog-service:8082;
    }

    location ^~ /api/books {
        proxy_pass http://catalog-service:8082;
    }

    location ^~ /api/admin {
        proxy_pass http://catalog-service:8082;
    }

    location ^~ /api/cart {
        proxy_pass http://cart-service:8084;
    }

    location ^~ /api/wishlist {
        proxy_pass http://cart-service:8084;
    }

    location ^~ /api/orders {
        proxy_pass http://order-service:8083;
    }

    location ^~ /api/payments {
        proxy_pass http://payment-service:8085;
    }

    location ^~ /api/buybacks {
        proxy_pass http://buyback-service:8086;
    }

    location / {
        return 404 '{"error":"Not found"}';
        default_type application/json;
    }
}

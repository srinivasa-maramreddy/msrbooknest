server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: ${APP_HEALTH_MAIL_ENABLED:false}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:auth_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=${MYSQL_SSL_MODE:DISABLED}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

app:
  web:
    origins: ${APP_WEB_ORIGINS:http://localhost:5173}
  demo:
    seed-users: ${APP_DEMO_SEED_USERS:false}
  jwt:
    secret: ${APP_JWT_SECRET:msrbooknest-demo-signing-key-change-me}
    expiration-ms: 86400000
  email:
    otp:
      enabled: ${APP_EMAIL_OTP_ENABLED:false}
      sender-email: ${GMAIL_SENDER_EMAIL:}
      subject-prefix: ${APP_EMAIL_OTP_SUBJECT_PREFIX:MSRBookNest}
      google:
        client-id: ${GMAIL_OAUTH_CLIENT_ID:}
        client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
        refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: ${APP_HEALTH_MAIL_ENABLED:false}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:auth_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=${MYSQL_SSL_MODE:DISABLED}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  demo:
    seed-users: ${APP_DEMO_SEED_USERS:true}
    allow-registration: ${APP_DEMO_ALLOW_REGISTRATION:true}
  otp:
    dev:
      show-codes: ${APP_OTP_DEV_SHOW_CODES:true}
  jwt:
    secret: ${APP_JWT_SECRET:msrbooknest-demo-signing-key-change-me}
    expiration-ms: 86400000
  email:
    otp:
      enabled: ${APP_EMAIL_OTP_ENABLED:false}
      from: ${APP_EMAIL_OTP_FROM:}
      subject-prefix: ${APP_EMAIL_OTP_SUBJECT_PREFIX:Bookstore}

services:
  # The browser is already hosted on GitHub Pages. Keep the bundled local UI off this VM.
  customer-web:
    profiles: [local]

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
    mem_limit: 1536m
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100

  auth-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  catalog-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  cart-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  order-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  payment-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      RAZORPAY_ENABLED: "false"
      RAZORPAY_ALLOW_LIVE: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  buyback-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in the ignored .env file}
      APP_WEB_ORIGINS: ${APP_WEB_ORIGINS:-https://srinivasa-maramreddy.github.io}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    mem_limit: 768m

  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    mem_limit: 1536m

  cloud-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./infra/oracle-free/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - payment-service
      - buyback-service
    mem_limit: 128m

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://cloud-gateway:8080
    depends_on:
      - cloud-gateway
    mem_limit: 128m

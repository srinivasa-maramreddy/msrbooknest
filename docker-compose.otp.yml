services:
  auth-service:
    environment:
      APP_EMAIL_OTP_ENABLED: "true"
      APP_EMAIL_OTP_SUBJECT_PREFIX: ${APP_EMAIL_OTP_SUBJECT_PREFIX:-MSRBookNest}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:?Set GMAIL_SENDER_EMAIL in .env.otp}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:?Set GMAIL_OAUTH_CLIENT_ID in .env.otp}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:?Set GMAIL_OAUTH_CLIENT_SECRET in .env.otp}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:?Set GMAIL_OAUTH_REFRESH_TOKEN in .env.otp}

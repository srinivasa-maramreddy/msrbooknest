services:
  auth-service:
    environment:
      APP_OTP_DEV_SHOW_CODES: "false"
      APP_HEALTH_MAIL_ENABLED: "true"
      APP_EMAIL_OTP_ENABLED: "true"
      APP_EMAIL_OTP_FROM: ${APP_EMAIL_OTP_FROM:?Set APP_EMAIL_OTP_FROM in .env.otp}
      APP_EMAIL_OTP_SUBJECT_PREFIX: ${APP_EMAIL_OTP_SUBJECT_PREFIX:-msrbooknest}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env.otp}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env.otp}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
      APP_SMS_MSG91_ENABLED: "true"
      APP_SMS_MSG91_ENDPOINT: ${APP_SMS_MSG91_ENDPOINT:-https://control.msg91.com/api/v5/flow/}
      APP_SMS_MSG91_AUTH_KEY: ${APP_SMS_MSG91_AUTH_KEY:?Set APP_SMS_MSG91_AUTH_KEY in .env.otp}
      APP_SMS_MSG91_TEMPLATE_ID: ${APP_SMS_MSG91_TEMPLATE_ID:?Set APP_SMS_MSG91_TEMPLATE_ID in .env.otp}
      APP_SMS_MSG91_COUNTRY_CODE: ${APP_SMS_MSG91_COUNTRY_CODE:-91}
      APP_SMS_MSG91_OTP_VARIABLE: ${APP_SMS_MSG91_OTP_VARIABLE:-OTP}

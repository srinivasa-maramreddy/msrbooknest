services:
  auth-service:
    environment:
      APP_OTP_DEV_SHOW_CODES: "false"
      APP_HEALTH_MAIL_ENABLED: "true"
      APP_EMAIL_OTP_ENABLED: "true"
      APP_EMAIL_OTP_FROM: ${APP_EMAIL_OTP_FROM:?Set APP_EMAIL_OTP_FROM in .env.otp}
      APP_EMAIL_OTP_SUBJECT_PREFIX: ${APP_EMAIL_OTP_SUBJECT_PREFIX:-msrbooknest}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env.otp}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env.otp}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}

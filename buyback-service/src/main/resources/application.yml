server:
  port: 8086
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/buyback_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500KB
      max-request-size: 4MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  jwt:
    secret: ${APP_JWT_SECRET:msrbooknest-demo-signing-key-change-me}
  web-origins: ${APP_WEB_ORIGINS:http://localhost:5173}

services:
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    ports:
      - "$NODE2_PRIVATE_IP:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://$NODE2_PRIVATE_IP:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_HEAP_OPTS: "-Xms96m -Xmx256m"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 448m

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order-service
    restart: unless-stopped
    ports:
      - "$NODE2_PRIVATE_IP:8083:8083"
    environment:
      PORT: "8083"
      MYSQL_HOST: $MYSQL_HOST
      MYSQL_PORT: $MYSQL_PORT
      MYSQL_DATABASE: order_db
      MYSQL_USERNAME: $MYSQL_USERNAME
      MYSQL_PASSWORD: $MYSQL_PASSWORD
      MYSQL_SSL_MODE: $MYSQL_SSL_MODE
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: $APP_JWT_SECRET
      APP_WEB_ORIGINS: $APP_WEB_ORIGINS
      CATALOG_SERVICE_BASE_URL: "http://$NODE1_PRIVATE_IP:8082"
      CART_SERVICE_BASE_URL: "http://$NODE1_PRIVATE_IP:8084"
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Xss512k"
    depends_on:
      - kafka
    mem_limit: 384m

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment-service
    restart: unless-stopped
    ports:
      - "$NODE2_PRIVATE_IP:8085:8085"
    environment:
      PORT: "8085"
      MYSQL_HOST: $MYSQL_HOST
      MYSQL_PORT: $MYSQL_PORT
      MYSQL_DATABASE: payment_db
      MYSQL_USERNAME: $MYSQL_USERNAME
      MYSQL_PASSWORD: $MYSQL_PASSWORD
      MYSQL_SSL_MODE: $MYSQL_SSL_MODE
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: $APP_JWT_SECRET
      APP_WEB_ORIGINS: $APP_WEB_ORIGINS
      ORDER_SERVICE_BASE_URL: http://order-service:8083
      RAZORPAY_ENABLED: "false"
      RAZORPAY_ALLOW_LIVE: "false"
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Xss512k"
    depends_on:
      - kafka
      - order-service
    mem_limit: 352m

  buyback-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: buyback-service
    restart: unless-stopped
    ports:
      - "$NODE2_PRIVATE_IP:8086:8086"
    environment:
      PORT: "8086"
      MYSQL_HOST: $MYSQL_HOST
      MYSQL_PORT: $MYSQL_PORT
      MYSQL_DATABASE: buyback_db
      MYSQL_USERNAME: $MYSQL_USERNAME
      MYSQL_PASSWORD: $MYSQL_PASSWORD
      MYSQL_SSL_MODE: $MYSQL_SSL_MODE
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: $APP_JWT_SECRET
      APP_WEB_ORIGINS: $APP_WEB_ORIGINS
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Xss512k"
    depends_on:
      - kafka
    mem_limit: 352m

volumes:
  kafka_data:

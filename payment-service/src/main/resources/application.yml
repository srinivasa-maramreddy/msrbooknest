server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
app:
  jwt:
    secret: ${APP_JWT_SECRET:msrbooknest-demo-signing-key-change-me}
  web-origins: ${APP_WEB_ORIGINS:http://localhost:5173}
  services:
    order-base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8083}
razorpay:
  enabled: ${RAZORPAY_ENABLED:false}
  mode: ${RAZORPAY_MODE:test}
  allow-live: ${RAZORPAY_ALLOW_LIVE:false}
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
